{% load static %}
<!DOCTYPE html>
<html lang="uz" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahsulotni o‘chirish — Django Market</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F4F4F6;
            color: #111113;
        }
        .bento-card {
            background-color: #FFFFFF;
            border-radius: 1.75rem;
            border: 1px solid rgba(0, 0, 0, 0.04);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.02);
        }
    </style>
</head>

<body class="antialiased min-h-screen flex items-center justify-center p-4">

    <div class="bento-card p-8 sm:p-10 max-w-md w-full text-center">
        <div class="w-16 h-16 rounded-full bg-rose-100 text-rose-500 flex items-center justify-center mx-auto mb-5 text-2xl">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>

        <h1 class="text-xl font-extrabold text-[#111113]">Mahsulotni o‘chirmoqchimisiz?</h1>
        <p class="text-xs sm:text-sm text-neutral-500 mt-2">
            Haqiqatan ham <strong class="text-neutral-800">«{{ product.name }}»</strong> mahsulotini bazadan o‘chirib tashlamoqchimisiz? Bu amalni ortga qaytarib bo‘lmaydi.
        </p>

        <form method="POST" class="mt-8 flex items-center justify-center gap-3">
            {% csrf_token %}
            <a href="{% url 'products:detail' product.pk %}" class="flex-1 py-3 px-4 rounded-full border border-black/10 text-[#111113] hover:bg-neutral-100 text-xs font-bold transition">
                Bekor qilish
            </a>
            <button type="submit" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white py-3 px-4 rounded-full text-xs font-bold transition shadow-xs cursor-pointer flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-trash-can text-xs"></i>
                <span>Ha, o‘chirish</span>
            </button>
        </form>
    </div>

</body>
</html>
